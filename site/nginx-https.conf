server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    return 404;
}
server {
    listen 80;
    listen [::]:80;
    server_name qiwuli.com www.qiwuli.com;
    location ^~ /.well-known/acme-challenge/ { root /var/lib/letsencrypt; try_files $uri =404; }
    location / { return 308 https://qiwuli.com$request_uri; }
}
server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_reject_handshake on;
}
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.qiwuli.com;
    server_tokens off;
    ssl_certificate /etc/letsencrypt/live/qiwuli.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/qiwuli.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    return 308 https://qiwuli.com$request_uri;
}
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name qiwuli.com;
    root /var/www/qiwuli.com;
    index index.html;
    charset utf-8;
    server_tokens off;
    ssl_certificate /etc/letsencrypt/live/qiwuli.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/qiwuli.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5:!3DES;
    ssl_session_cache shared:qiwuliSSL:2m;
    ssl_session_timeout 10m;
    ssl_session_tickets off;
    keepalive_timeout 30;
    client_max_body_size 1m;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; connect-src 'self'; base-uri 'none'; frame-ancestors 'none'; form-action 'none'" always;
    add_header Strict-Transport-Security "max-age=604800" always;
    location ^~ /.well-known/acme-challenge/ { root /var/lib/letsencrypt; try_files $uri =404; }
    location ~ /\. { deny all; }
    location = /index.html { expires -1; }
    location /assets/ { try_files $uri =404; expires 1y; }
    location ~ ^/(projects|journal|lab|about|contact)(/|$) { try_files $uri /index.html; }
    location = /404 { try_files $uri /index.html; }
    location / { try_files $uri $uri/ =404; }
}
