limit_req_zone $binary_remote_addr zone=workstation_auth:1m rate=20r/m;

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name workbench.qiwuli.com;
    server_tokens off;
    ssl_certificate /etc/letsencrypt/live/workbench.qiwuli.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/workbench.qiwuli.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    if ($ssl_server_name != workbench.qiwuli.com) { return 444; }
    add_header Strict-Transport-Security "max-age=31536000" always;
    access_log off;

    location = / {
        default_type text/plain;
        charset utf-8;
        return 200 '私有 Codex 开发与运维工作站\n';
    }
    location = /downloads/windows/latest.zip { return 410; }
    location ~ ^/e64c1f0ba3427d59/(hello|bind|session)$ {
        limit_req zone=workstation_auth burst=10 nodelay;
        limit_req_status 429;
        client_max_body_size 8k;
        proxy_set_header X-Workbench-Ingress workstation-v3;
        proxy_set_header X-Workbench-Client-IP $remote_addr;
        proxy_set_header Connection '';
        proxy_http_version 1.1;
        proxy_pass http://127.0.0.1:8766;
    }
    location ^~ /e64c1f0ba3427d59/api/ {
        client_max_body_size 8m;
        proxy_set_header X-Workbench-Ingress workstation-v3;
        proxy_set_header X-Workbench-Client-IP $remote_addr;
        proxy_set_header Connection '';
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_read_timeout 80s;
        proxy_pass http://127.0.0.1:8766;
    }
    location / { return 404; }
}
