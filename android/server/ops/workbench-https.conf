limit_req_zone $binary_remote_addr zone=workbench_renewal:1m rate=30r/m;

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name workbench.qiwuli.com;
    server_tokens off;
    ssl_certificate /etc/letsencrypt/live/workbench.qiwuli.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/workbench.qiwuli.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    if ($ssl_server_name != workbench.qiwuli.com) { return 444; }

    access_log off;
    add_header Strict-Transport-Security "max-age=31536000" always;
    client_max_body_size 8m;
    proxy_http_version 1.1;
    proxy_connect_timeout 5s;
    proxy_read_timeout 70s;
    proxy_send_timeout 70s;

    include /opt/cloud-workbench-enrollment/workbench-enrollment.locations;
    include /opt/cloud-workbench-v3/workbench-v3.locations;
    include /var/www/cloud-workbench-portal/current/workbench-portal.locations;
}
