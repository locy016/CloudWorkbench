pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        maven { url uri(new File(System.getenv('LOCALAPPDATA') ?: System.getProperty('user.home'), 'CloudWorkbench/android-maven')) }
        google(); mavenCentral()
    }
}
rootProject.name = 'CloudWorkbench'
include ':app'
