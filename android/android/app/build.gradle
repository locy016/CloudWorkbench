plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
}
android {
    namespace 'cn.xux.cloudworkbench'
    compileSdk 35
    defaultConfig {
        applicationId 'cn.xux.cloudworkbench'
        minSdk 26
        targetSdk 35
        versionCode = 63
        versionName = '0.4.50'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }
    if (providers.gradleProperty('usbAcceptance').isPresent()) {
        buildTypes.debug.applicationIdSuffix = '.acceptance'
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    kotlinOptions { jvmTarget = '17' }
    buildFeatures { compose true; buildConfig true }
    // Sherpa reads each ONNX model into a vector. Keep the large source asset mmap-backed.
    androidResources { noCompress += 'onnx' }
    packaging {
        jniLibs.useLegacyPackaging = true
        resources.excludes += ['META-INF/versions/9/OSGI-INF/MANIFEST.MF']
    }
}
dependencies {
    implementation files('libs/sherpa-onnx-2.0.1.aar')
    implementation 'androidx.activity:activity-compose:1.10.1'
    implementation platform('androidx.compose:compose-bom:2025.04.01')
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.material:material-icons-extended:1.7.8'
    implementation 'androidx.lifecycle:lifecycle-runtime-compose:2.9.0'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.9.0'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'com.github.mwiede:jsch:2.28.0'
    implementation 'androidx.webkit:webkit:1.12.1'
    androidTestImplementation platform('androidx.compose:compose-bom:2025.04.01')
    androidTestImplementation 'androidx.compose.ui:ui-test-junit4'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    debugImplementation 'androidx.compose.ui:ui-test-manifest'
}

tasks.register('checkVoiceAssets') {
    doLast {
        def assets = [
            'libs/sherpa-onnx-2.0.1.aar',
            'src/main/assets/voice/encoder.int8.onnx',
            'src/main/assets/voice/decoder.onnx',
            'src/main/assets/voice/joiner.int8.onnx',
            'src/main/assets/voice/tokens.txt'
        ]
        if (assets.any { !file(it).isFile() || file(it).length() == 0 }) {
            throw new GradleException('Run tools/prepare-voice-model.ps1 before building the Android app.')
        }
    }
}
tasks.named('preBuild') { dependsOn 'checkVoiceAssets' }
