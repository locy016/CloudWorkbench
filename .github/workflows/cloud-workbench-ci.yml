name: 云端工作台 CI
run-name: 云端工作台 CI · ${{ inputs.source_sha || github.sha }}${{ inputs.request_id && format(' · {0}', inputs.request_id) || '' }}

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      source_sha:
        description: 可选，待验收源码的完整 Git 提交 SHA
        type: string
      request_id:
        description: 可选，云端工作台构建请求编号
        type: string

permissions:
  contents: read

jobs:
  gateway:
    name: 网关测试
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: 检出源码
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.source_sha || github.sha }}
          persist-credentials: false
      - name: 核对待验收提交
        shell: bash
        env:
          SOURCE_SHA: ${{ inputs.source_sha || github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          printf '源码提交 `%s`\n' "$SOURCE_SHA" >> "$GITHUB_STEP_SUMMARY"
      - name: 配置 Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
      - name: 运行网关测试
        working-directory: android/server
        run: |
          npm ci --ignore-scripts
          npm test

  android:
    name: Android Lint 和未签名 APK
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - name: 检出源码
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.source_sha || github.sha }}
          persist-credentials: false
      - name: 核对待验收提交
        shell: pwsh
        env:
          SOURCE_SHA: ${{ inputs.source_sha || github.sha }}
        run: |
          if ((git rev-parse HEAD) -ne $env:SOURCE_SHA) { throw '检出的源码提交不一致' }
          Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value "源码提交 $env:SOURCE_SHA"
      - name: 配置 JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'
      - name: 校验 Android SDK 及语音资源
        shell: pwsh
        run: |
          if (!(Test-Path -LiteralPath (Join-Path $env:ANDROID_HOME 'platforms/android-35/android.jar'))) {
            throw 'GitHub 托管环境缺少 Android SDK 35'
          }
          ./android/tools/prepare-voice-model.ps1
      - name: Android Lint
        shell: pwsh
        working-directory: android/android
        run: |
          ./gradlew.bat --console=plain --no-daemon :app:lintRelease
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: 构建并检查未签名 APK
        shell: pwsh
        working-directory: android/android
        env:
          SOURCE_SHA: ${{ inputs.source_sha || github.sha }}
        run: |
          ./gradlew.bat --console=plain --no-daemon :app:assembleRelease
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $apk = Resolve-Path -LiteralPath 'app/build/outputs/apk/release/app-release-unsigned.apk'
          $apkTools = Join-Path $env:ANDROID_HOME 'build-tools/35.0.0'
          & (Join-Path $apkTools 'aapt.exe') dump badging $apk.Path | Select-String '^package:'
          if ($LASTEXITCODE) { throw '无法读取 APK 包信息' }
          $PSNativeCommandUseErrorActionPreference = $false
          & (Join-Path $apkTools 'apksigner.bat') verify $apk.Path 2>&1 | Out-Null
          if ($LASTEXITCODE -ne 1) { throw '未得到预期的未签名校验结果' }
          $digest = (Get-FileHash -LiteralPath $apk.Path -Algorithm SHA256).Hash.ToLowerInvariant()
          $artifact = New-Item -ItemType Directory -Path (Join-Path $env:RUNNER_TEMP 'workbench-unsigned-build')
          Copy-Item -LiteralPath $apk.Path -Destination $artifact.FullName
          Set-Content -LiteralPath (Join-Path $artifact.FullName 'SHA256SUMS') -Value "$digest  app-release-unsigned.apk" -Encoding ascii
          Set-Content -LiteralPath (Join-Path $artifact.FullName 'source-commit.txt') -Value $env:SOURCE_SHA -Encoding ascii
          exit 0
      - name: 上传未签名 APK 与源码摘要
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: android-unsigned-apk
          path: ${{ runner.temp }}/workbench-unsigned-build
          if-no-files-found: error
          retention-days: 5
      - name: 上传 Android Lint 报告
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: android-lint-report
          path: android/android/app/build/reports/lint-results-release.*
          if-no-files-found: ignore
          retention-days: 5
